spring.application.name=api
# URL de conexão com o MySQL na porta padrão do XAMPP (3306)
# O parâmetro no final faz o Java criar o banco 'db_api' sozinho se ele não existir!
spring.datasource.url=jdbc:mysql://localhost:3306/db_api?createDatabaseIfNotExist=true

# Usuário e senha padrão do XAMPP
spring.datasource.username=root
spring.datasource.password=

# Pede para o Spring Boot criar ou atualizar as tabelas automaticamente baseado na sua FuncionarioEntity
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console (ótimo para aprender e debugar)
spring.jpa.show-sql=true